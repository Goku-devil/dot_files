# --- Background ---
background {
    monitor =
    # Use 'screenshot' to capture your current screen, or point to a minimalist wallpaper
    path = screenshot   
    
    # Blur effects
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- The Clock ---
label {
    monitor =
    text = $TIME
    text_align = center
    color = rgba(200, 200, 200, 1.0)
    font_size = 120
    font_family = monospace
    
    # Positioning
    position = 0, -100
    halign = center
    valign = top
}

# --- Custom Greeting ---
label {
    monitor =
    text = Welcome back, Goku
    text_align = center
    color = rgba(255, 255, 255, 0.6)
    font_size = 22
    font_family = monospace
    
    position = 0, -40
    halign = center
    valign = center
}

# --- The Input Prompt ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    
    # Dot styling
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Colors
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    check_color = rgba(0, 170, 255, 0.5) # Cyan when checking password
    fail_color = rgba(255, 0, 51, 0.5)   # Red on fail
    
    # THE PROMPT TEXT
    fade_on_empty = false
    font_family = monospace
    placeholder_text = <i>Authenticate...</i> 
    
    hide_input = false
    
    position = 0, -120
    halign = center
    valign = center
}

# --- Avatar ---
image {
    monitor =
    # Use an absolute path for your image to prevent expansion issues
    path = /home/goku/Pictures/avatar.png
    
    size = 120
    rounding = -1 # Setting to -1 makes it a perfect circle
    border_size = 2
    border_color = rgba(255, 255, 255, 0.1)
    
    # Positioned right above the greeting
    position = 0, 80
    halign = center
    valign = center
}
