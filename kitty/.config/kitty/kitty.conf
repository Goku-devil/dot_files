# ==============================================================================
# WINDOW PADDING SETTINGS
# ==============================================================================

# Internal padding layout (in points)
window_padding_width 12


# ==============================================================================
# FONT SETTINGS
# ==============================================================================

# Font size (in pts)
font_size        12.0

# Optional: Adjust line spacing if the font feels too cramped
modify_font baseline 0
modify_font underline_position 2

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME