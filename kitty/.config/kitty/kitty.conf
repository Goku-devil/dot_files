# ==============================================================================
# TRANSPARENCY & BLUR SETTINGS
# ==============================================================================

# Map Kali symbols (U+327F for ㉿, U+2620 for ☠) to a Nerd Font or Noto Sans
symbol_map U+327F,U+2620 JetBrainsMono Nerd Font

# Set the background opacity (0.0 is fully transparent, 1.0 is opaque)
background_opacity 0.85

# Enable background blur (takes a radius usually between 1 and 64)
# Note: This requires OS/compositor support (e.g., macOS, KDE, or Hyprland)
background_blur 64

# Optional: Removes the titlebar color to blend better with transparency on some systems
hide_window_decorations yes


