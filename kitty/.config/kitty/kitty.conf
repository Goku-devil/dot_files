# ==============================================================================
# TRANSPARENCY & BLUR SETTINGS
# ==============================================================================

# Map Kali symbols (U+327F for ㉿, U+2620 for ☠) to a Nerd Font or Noto Sans
symbol_map U+327F,U+2620 JetBrainsMono Nerd Font

# Set the background opacity (0.0 is fully transparent, 1.0 is opaque)
background_opacity 0.70

# Enable background blur (takes a radius usually between 1 and 64)
# Note: This requires OS/compositor support (e.g., macOS, KDE, or Hyprland)
#background_blur 64

# Optional: Removes the titlebar color to blend better with transparency on some systems
hide_window_decorations yes


# ==============================================================================
# WINDOW PADDING SETTINGS
# ==============================================================================

# Internal padding layout (in points)
window_padding_width 12


# ==============================================================================
# FONT SETTINGS
# ==============================================================================

# Font size (in pts)
font_size        12.0

# Optional: Adjust line spacing if the font feels too cramped
modify_font baseline 0
modify_font underline_position 2

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# ==============================================================================
# DYNAMIC THEME ENGINE
# ==============================================================================

# This imports the symlinked theme file managed by apply_theme.sh
include theme.conf
